name: Launch candidate checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check JavaScript
        run: |
          node --check app.js
          node --check studio-v2.js
          node --check media-upload-v3.js
          node --check launch-writer.js
          node --check launch-social.js
          node --check account-nav-v4.js
          node --check studio-nav-v6.js
          node --check visitor-stats-v1.js
          node --check admin-control-v2.js
          node --check writer-studio-v3.js
          node --check writer-studio-v3-planning.js
      - name: Verify launch files
        run: |
          test -s index.html
          test -s styles.css
          test -s terms.html
          test -s privacy.html
          test -s guidelines.html
          test -s CNAME
          test -s balance-due/final/Balance_Due_FINAL.txt
          test -s supabase/visitor_stats_v1.sql
          test -s supabase/admin_control_centre_v2.sql
          test -s supabase/writer_studio_v3.sql
          test -s docs/writer-studio-v3-spec.md
          test -s writer-studio-v3.js
          test -s writer-studio-v3.css
          test -s writer-studio-v3-planning.js
          test -s writer-studio-v3-planning.css
          grep -qx 'writelite.co.uk' CNAME
          grep -q 'Writelite' studio-nav-v6.js
          grep -q 'Writelite' terms.html
          grep -q 'Writelite' privacy.html
          grep -q 'Writelite' guidelines.html
          grep -q 'launch-writer.js' index.html
          grep -q 'launch-social.js' index.html
          grep -q 'media-upload-v3.js' index.html
          grep -q 'account-nav-v4.js' index.html
          grep -q 'studio-nav-v6.js' index.html
          grep -q 'visitor-stats-v1.js' index.html
          grep -q 'admin-control-v2.js' index.html
          grep -q 'writer-studio-v3.js' index.html
          grep -q 'writer-studio-v3.css' index.html
          grep -q 'writer-studio-v3-planning.js' index.html
          grep -q 'writer-studio-v3-planning.css' index.html
      - name: Verify Balance Due reader source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('balance-due/final/Balance_Due_FINAL.txt')
          data = path.read_bytes()
          expected_sha = 'd95fd172ed65282c21ca52ae62082b1e4667005b7bbf061aa8ac6a9bf2e3f87a'
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f'Balance Due checksum mismatch: {digest}')

          text = data.decode('utf-8')
          headings = [line.strip() for line in text.splitlines() if line.strip() in {'Prologue', 'Epilogue'} or (line.strip().startswith('Chapter ') and line.strip()[8:].isdigit())]
          expected_headings = ['Prologue'] + [f'Chapter {i}' for i in range(1, 10)] + ['Epilogue']
          if headings != expected_headings:
              raise SystemExit(f'Unexpected Balance Due headings: {headings}')
          print('Balance Due reader source OK:', digest, headings)
          PY
      - name: Guard against server secrets in frontend
        run: |
          if grep -R --line-number -E 'service_role|sb_secret_' --include='*.js' --include='*.html' .; then
            echo 'Server-only secret marker found in frontend.' >&2
            exit 1
          fi
