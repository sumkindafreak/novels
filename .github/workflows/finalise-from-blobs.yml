name: Finalise Novels web app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalise-from-blobs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assemble and verify web app
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_chunks/app.part0 .upload_chunks/app.part1 .upload_chunks/app.part2 .upload_chunks/app.part3 > app.js
          echo "78e045c0e340d96f1fcdaa27c9760b65df808426d74549488ffb701ec93099ba  app.js" | sha256sum -c -
          node --check app.js

      - name: Commit finished web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .upload_chunks/app.part0 .upload_chunks/app.part1 .upload_chunks/app.part2 .upload_chunks/app.part3
          rm -f .github/workflows/finalise-from-blobs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add verified Novels app bundle'
          git push
