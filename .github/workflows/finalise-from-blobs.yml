name: Finalise Novels from verified blobs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalise-from-blobs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore locked Balance Due manuscript from verified Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balance-due/final
          python - <<'PY'
          import base64, gzip, hashlib, json, os, urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          shas = [
              '49e5c3a3569220f797391721100706c64123381c',
              'e3c6df878d943738242ba1f9de0fb301d9b3712f',
          ]
          encoded_parts = []
          for sha in shas:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'novels-finaliser',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              encoded_parts.append(base64.b64decode(payload['content']).decode('utf-8'))

          manuscript = gzip.decompress(base64.b64decode(''.join(encoded_parts)))
          expected = 'd95fd172a7ae1269d2a4d202314c72a0be06bf533fbcbf27a27ad64e2bdc37a6'
          actual = hashlib.sha256(manuscript).hexdigest()
          if actual != expected:
              raise SystemExit(f'Locked manuscript checksum mismatch: {actual}')
          path = 'balance-due/final/Balance_Due_FINAL.txt'
          open(path, 'wb').write(manuscript)
          print(f'Locked manuscript restored: {len(manuscript)} bytes, SHA256 {actual}')
          PY

      - name: Assemble and verify web app
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_chunks/app.part0 .upload_chunks/app.part1 .upload_chunks/app.part2 .upload_chunks/app.part3 > app.js
          echo "78e045c0e340d96f1fcdaa27c9760b65df808426d74549488ffb701ec93099ba  app.js" | sha256sum -c -
          node --check app.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install book builders
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0 EbookLib==0.20

      - name: Build final DOCX and EPUB
        run: python tools/build_balance_due.py

      - name: Verify book archives
        shell: bash
        run: |
          set -euo pipefail
          test -s balance-due/final/Balance_Due_FINAL.txt
          test -s balance-due/final/Balance_Due_FINAL.docx
          test -s balance-due/final/Balance_Due_FINAL.epub
          python - <<'PY'
          import zipfile
          for path in [
              'balance-due/final/Balance_Due_FINAL.docx',
              'balance-due/final/Balance_Due_FINAL.epub',
          ]:
              with zipfile.ZipFile(path) as archive:
                  bad = archive.testzip()
                  if bad is not None:
                      raise SystemExit(f'Corrupt archive member in {path}: {bad}')
              print('Archive OK:', path)
          PY

      - name: Remove temporary staging and commit final launch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload_chunks
          rm -f .github/workflows/finalise-balance-due.yml
          rm -f .github/workflows/finalise-from-blobs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Balance Due final masters and Novels app bundle'
          git push
